<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 180" fill="none">

  <!-- Grid lines (semi-transparent, work on light and dark) -->
  <line x1="30" y1="148" x2="210" y2="148" stroke="#71717a" stroke-width="1" stroke-opacity="0.25"/>
  <line x1="30" y1="128" x2="210" y2="128" stroke="#71717a" stroke-width="1" stroke-opacity="0.2"/>
  <line x1="30" y1="108" x2="210" y2="108" stroke="#71717a" stroke-width="1" stroke-opacity="0.15"/>
  <line x1="30" y1="88"  x2="210" y2="88"  stroke="#71717a" stroke-width="1" stroke-opacity="0.1"/>

  <!-- Bars -->
  <rect x="36"  y="112" width="20" height="36" rx="5" fill="#818cf8" opacity="0.85"/>
  <rect x="66"  y="94"  width="20" height="54" rx="5" fill="#6366f1"/>
  <rect x="96"  y="104" width="20" height="44" rx="5" fill="#818cf8" opacity="0.85"/>
  <rect x="126" y="84"  width="20" height="64" rx="5" fill="#6366f1"/>
  <rect x="156" y="98"  width="20" height="50" rx="5" fill="#818cf8" opacity="0.85"/>
  <rect x="186" y="90"  width="20" height="58" rx="5" fill="#6366f1"/>

  <!-- Baseline -->
  <line x1="30" y1="148" x2="210" y2="148" stroke="#71717a" stroke-width="1.5" stroke-opacity="0.4" stroke-linecap="round"/>

  <!-- Line area fill -->
  <path d="M36,122 L66,106 L96,115 L126,98 L156,110 L186,103 L206,106 L206,148 L36,148 Z"
    fill="#6366f1" opacity="0.06"/>

  <!-- Line -->
  <polyline points="36,122 66,106 96,115 126,98 156,110 186,103 206,106"
    fill="none" stroke="#6366f1" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>

  <!-- Line dots -->
  <circle cx="36"  cy="122" r="4" fill="#6366f1"/>
  <circle cx="96"  cy="115" r="4" fill="#6366f1"/>
  <circle cx="126" cy="98"  r="4" fill="#6366f1"/>
  <circle cx="186" cy="103" r="4" fill="#6366f1"/>


  <!-- Donut (overlapping, top-right) -->
  <circle cx="256" cy="72" r="36" fill="none" stroke="#71717a" stroke-width="18" stroke-opacity="0.12"/>
  <circle cx="256" cy="72" r="36" fill="none" stroke="#6366f1" stroke-width="18"
    stroke-dasharray="56 170" stroke-dashoffset="22"/>
  <circle cx="256" cy="72" r="36" fill="none" stroke="#818cf8" stroke-width="18"
    stroke-dasharray="38 188" stroke-dashoffset="-34"/>
  <circle cx="256" cy="72" r="36" fill="none" stroke="#c7d2fe" stroke-width="18"
    stroke-dasharray="28 198" stroke-dashoffset="-72"/>

  <!-- Center text -->
  <text x="256" y="76" text-anchor="middle" fill="#6366f1" font-size="13" font-family="sans-serif" font-weight="700">64%</text>

</svg>
